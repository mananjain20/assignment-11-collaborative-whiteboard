<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Collaborative Whiteboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header Bar -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
          <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
          <path d="M2 2l7.586 7.586"></path>
          <circle cx="11" cy="11" r="2"></circle>
        </svg>
      </div>
      <span>Whiteboard</span>
    </div>

    <!-- Room Selection Form -->
    <div class="room-bar">
      <div class="input-group">
        <label for="boardIdInput">Board ID</label>
        <input type="text" id="boardIdInput" class="app-input" placeholder="e.g. demo" value="demo">
      </div>

      <div class="input-group">
        <label for="usernameInput">User</label>
        <input type="text" id="usernameInput" class="app-input" placeholder="Your name">
      </div>

      <div class="color-picker-wrapper" title="Choose your cursor color">
        <input type="color" id="userColorPicker" class="color-picker" value="#3b82f6">
      </div>

      <button id="joinBtn" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        Join Board
      </button>
    </div>

    <!-- Online Users List -->
    <div class="user-status-container">
      <span id="roomStatusText" style="font-size: 0.85rem; color: var(--text-muted);">Not Connected</span>
      <div class="users-list" id="activeUsersList"></div>
    </div>
  </header>

  <!-- Canvas Wrapper Area -->
  <main class="canvas-wrapper" id="canvasContainer">
    <canvas id="paintCanvas"></canvas>
    
    <!-- Remote Cursors Overlay -->
    <div class="cursors-layer" id="cursorsLayer"></div>

    <!-- Floating Drawing Toolbar -->
    <div class="toolbar-container">
      <!-- Tool Selection -->
      <div class="toolbar-group">
        <button id="brushToolBtn" class="tool-btn active" title="Brush Tool">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
          </svg>
        </button>
        <button id="eraserToolBtn" class="tool-btn" title="Eraser Tool">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path>
            <path d="M22 21H7"></path>
            <path d="m5 11 9 9"></path>
          </svg>
        </button>
      </div>

      <div class="divider"></div>

      <!-- Stroke Color Palette -->
      <div class="toolbar-group preset-colors">
        <div class="color-swatch active" style="background-color: #f8fafc;" data-color="#f8fafc" title="White"></div>
        <div class="color-swatch" style="background-color: #ef4444;" data-color="#ef4444" title="Red"></div>
        <div class="color-swatch" style="background-color: #3b82f6;" data-color="#3b82f6" title="Blue"></div>
        <div class="color-swatch" style="background-color: #10b981;" data-color="#10b981" title="Green"></div>
        <div class="color-swatch" style="background-color: #f59e0b;" data-color="#f59e0b" title="Yellow"></div>
        <div class="color-swatch" style="background-color: #ec4899;" data-color="#ec4899" title="Pink"></div>
        <div class="color-picker-wrapper" title="Custom Brush Color">
          <input type="color" id="brushColorPicker" class="color-picker" value="#f8fafc">
        </div>
      </div>

      <div class="divider"></div>

      <!-- Brush Size Slider -->
      <div class="toolbar-group size-slider-wrapper">
        <input type="range" id="brushSizeInput" class="size-slider" min="1" max="40" value="4">
        <span class="size-badge" id="brushSizeVal">4px</span>
      </div>

      <div class="divider"></div>

      <!-- Action Buttons (Undo / Clear) -->
      <div class="toolbar-group">
        <button id="undoBtn" class="btn btn-secondary" title="Undo Last Stroke">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 7v6h6"></path>
            <path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"></path>
          </svg>
          Undo
        </button>
        <button id="clearBtn" class="btn btn-danger" title="Clear Canvas For Everyone">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Clear
        </button>
      </div>
    </div>
  </main>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Socket.io client script & Main Application Script -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="canvas.js"></script>
</body>
</html>
